[project]
name = "ai-directors-cut"
version = "0.1.0"
description = "Local AI video editor: raw footage in, stylized highlight reel out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests shell out to ffmpeg and decode video; unit tests do not.
markers = [
    "integration: exercises the real pipeline end to end (needs ffmpeg)",
]
